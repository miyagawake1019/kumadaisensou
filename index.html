<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くま大戦争</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Menu -->
        <div id="main-menu-screen">
            <h1>くま大戦争</h1>
            <div class="menu-buttons">
                <button id="menu-start-btn" class="menu-btn">出撃 (Battle)</button>
                <button id="menu-team-btn" class="menu-btn">編成 (Team)</button>
                <button id="menu-gacha-btn" class="menu-btn">ガチャ (Gacha)</button>
                <button id="menu-zukan-btn" class="menu-btn">図鑑 (Zukan)</button>
            </div>
            <div id="global-coins-display">所持コイン: <span id="player-coins">0</span></div>
        </div>

        <!-- Team Select Screen -->
        <div id="team-select-screen" style="display: none;">
            <h2>チーム編成 (Team Edit)</h2>
            <p>3匹まで選んでください (<span id="team-count">0 / 3</span>)</p>
            <div id="team-grid">
                <!-- Generated by JS -->
            </div>
            <button id="back-to-menu-from-team-btn" class="back-btn">戻る</button>
        </div>

        <!-- Stage Select -->
        <div id="stage-select-screen" style="display: none;">
            <h2>ステージを選んでください</h2>
            <div class="stage-list">
                <!-- 1-10 -->
                <button class="stage-btn" data-stage="1">ステージ 1: 森の入り口</button>
                <button class="stage-btn" data-stage="2">ステージ 2: 蜂蜜の川</button>
                <button class="stage-btn" data-stage="3">ステージ 3: 洞窟の奥</button>
                <button class="stage-btn" data-stage="4">ステージ 4: 迷いの森</button>
                <button class="stage-btn" data-stage="5">ステージ 5: 嵐の山</button>
                <button class="stage-btn" data-stage="6">ステージ 6: 灼熱の砂漠</button>
                <button class="stage-btn" data-stage="7">ステージ 7: 氷の宮殿</button>
                <button class="stage-btn" data-stage="8">ステージ 8: 天空の城</button>
                <button class="stage-btn" data-stage="9">ステージ 9: 宇宙の果て</button>
                <button class="stage-btn" data-stage="10">ステージ 10: クマの神域</button>
                <!-- 11-20 -->
                <button class="stage-btn" data-stage="11">ステージ 11: 異次元の扉</button>
                <button class="stage-btn" data-stage="12">ステージ 12: 歪んだ時空</button>
                <button class="stage-btn" data-stage="13">ステージ 13: 混沌の海</button>
                <button class="stage-btn" data-stage="14">ステージ 14: 絶望の淵</button>
                <button class="stage-btn" data-stage="15">ステージ 15: 終焉の地</button>
                <button class="stage-btn" data-stage="16">ステージ 16: 再生の光</button>
                <button class="stage-btn" data-stage="17">ステージ 17: 神々の遊戯</button>
                <button class="stage-btn" data-stage="18">ステージ 18: 無限の回廊</button>
                <button class="stage-btn" data-stage="19">ステージ 19: 真理の扉</button>
                <button class="stage-btn" data-stage="20">ステージ 20: 最終決戦</button>
                <!-- 21-30 -->
                <button class="stage-btn" data-stage="21">ステージ 21: 天使の階段</button>
                <button class="stage-btn" data-stage="22">ステージ 22: 悪魔の住処</button>
                <button class="stage-btn" data-stage="23">ステージ 23: 機械仕掛けの森</button>
                <button class="stage-btn" data-stage="24">ステージ 24: 侍の道場</button>
                <button class="stage-btn" data-stage="25">ステージ 25: 竜の巣窟</button>
                <button class="stage-btn" data-stage="26">ステージ 26: 虹の架け橋</button>
                <button class="stage-btn" data-stage="27">ステージ 27: 闇の深淵</button>
                <button class="stage-btn" data-stage="28">ステージ 28: 光の果て</button>
                <button class="stage-btn" data-stage="29">ステージ 29: 虚無の空間</button>
                <button class="stage-btn" data-stage="30">ステージ 30: 新・最終決戦</button>
                <!-- 31-50 -->
                <button class="stage-btn" data-stage="31">ステージ 31: 幻影の塔 1F</button>
                <button class="stage-btn" data-stage="32">ステージ 32: 幻影の塔 2F</button>
                <button class="stage-btn" data-stage="33">ステージ 33: 幻影の塔 3F</button>
                <button class="stage-btn" data-stage="34">ステージ 34: 幻影の塔 4F</button>
                <button class="stage-btn" data-stage="35">ステージ 35: 幻影の塔 5F</button>
                <button class="stage-btn" data-stage="36">ステージ 36: 幻影の塔 6F</button>
                <button class="stage-btn" data-stage="37">ステージ 37: 幻影の塔 7F</button>
                <button class="stage-btn" data-stage="38">ステージ 38: 幻影の塔 8F</button>
                <button class="stage-btn" data-stage="39">ステージ 39: 幻影の塔 9F</button>
                <button class="stage-btn" data-stage="40">ステージ 40: 幻影の塔 頂上</button>
                <button class="stage-btn" data-stage="41">ステージ 41: 裏・森の入り口</button>
                <button class="stage-btn" data-stage="42">ステージ 42: 裏・蜂蜜の川</button>
                <button class="stage-btn" data-stage="43">ステージ 43: 裏・洞窟の奥</button>
                <button class="stage-btn" data-stage="44">ステージ 44: 裏・迷いの森</button>
                <button class="stage-btn" data-stage="45">ステージ 45: 裏・嵐の山</button>
                <button class="stage-btn" data-stage="46">ステージ 46: 裏・灼熱の砂漠</button>
                <button class="stage-btn" data-stage="47">ステージ 47: 裏・氷の宮殿</button>
                <button class="stage-btn" data-stage="48">ステージ 48: 裏・天空の城</button>
                <button class="stage-btn" data-stage="49">ステージ 49: 裏・宇宙の果て</button>
                <button class="stage-btn" data-stage="50">ステージ 50: 真・クマの神域</button>
            </div>
            <button id="back-to-menu-btn" class="back-btn">戻る</button>
        </div>

        <!-- Gacha Screen -->
        <div id="gacha-screen" style="display: none;">
            <h2>キャラガチャ</h2>
            <div id="gacha-visual">
                <div id="gacha-result">?</div>
            </div>
            <p>1回 500コイン</p>
            <button id="pull-gacha-btn" class="menu-btn">ガチャを回す</button>
            <div id="gacha-message"></div>
            <button id="back-to-menu-from-gacha-btn" class="back-btn">戻る</button>
        </div>

        <!-- Zukan Screen -->
        <div id="zukan-screen" style="display: none;">
            <h2>キャラクター図鑑</h2>
            <div id="zukan-grid">
                <!-- Generated by JS -->
            </div>
            <button id="back-to-menu-from-zukan-btn" class="back-btn">戻る</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" style="display: none;">
            <div id="game-header">
                <h2 id="current-stage-title">Stage Title</h2>
                <div id="money-container">¥ <span id="money-display">0</span></div>
            </div>

            <div id="battle-field">
                <div id="player-base" class="base">
                    <div class="base-hp">HP: <span id="player-base-hp">1000</span></div>
                    🏠
                </div>
                <div id="lane">
                    <!-- Units will be added here dynamically -->
                </div>
                <div id="enemy-base" class="base">
                    <div class="base-hp">HP: <span id="enemy-base-hp">1000</span></div>
                    🏰
                </div>
            </div>

            <div id="controls">
                <!-- Buttons generated by JS based on unlocks -->
            </div>

            <button id="back-to-select-btn">撤退する (ステージ選択へ)</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
