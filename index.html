<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くま大戦争</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="stage-select-screen">
            <h1>くま大戦争</h1>
            <h2>ステージを選んでください</h2>
            <div class="stage-list">
                <button class="stage-btn" data-stage="1">ステージ 1: 森の入り口</button>
                <button class="stage-btn" data-stage="2">ステージ 2: 蜂蜜の川</button>
                <button class="stage-btn" data-stage="3">ステージ 3: 洞窟の奥</button>
                <button class="stage-btn" data-stage="4">ステージ 4: 迷いの森</button>
                <button class="stage-btn" data-stage="5">ステージ 5: 嵐の山</button>
                <button class="stage-btn" data-stage="6">ステージ 6: 灼熱の砂漠</button>
                <button class="stage-btn" data-stage="7">ステージ 7: 氷の宮殿</button>
                <button class="stage-btn" data-stage="8">ステージ 8: 天空の城</button>
                <button class="stage-btn" data-stage="9">ステージ 9: 宇宙の果て</button>
                <button class="stage-btn" data-stage="10">ステージ 10: クマの神域</button>
            </div>
        </div>
        <div id="game-screen" style="display: none;">
            <div id="game-header">
                <h2 id="current-stage-title">Stage Title</h2>
                <div id="money-container">¥ <span id="money-display">0</span></div>
            </div>

            <div id="battle-field">
                <div id="player-base" class="base">
                    <div class="base-hp">HP: <span id="player-base-hp">1000</span></div>
                    🏠
                </div>
                <div id="lane">
                    <!-- Units will be added here dynamically -->
                </div>
                <div id="enemy-base" class="base">
                    <div class="base-hp">HP: <span id="enemy-base-hp">1000</span></div>
                    🏰
                </div>
            </div>

            <div id="controls">
                <button class="summon-btn" data-cost="100" data-type="little">
                    こぐま<br>¥100
                </button>
                <button class="summon-btn" data-cost="300" data-type="pillar">
                    柱グマ<br>¥300
                </button>
                <button class="summon-btn" data-cost="500" data-type="big">
                    おオグマ<br>¥500
                </button>
                <button class="summon-btn" data-cost="1000" data-type="max">
                    最大おおぐま<br>¥1000
                </button>
                <button class="summon-btn" data-cost="2000" data-type="ninja">
                    忍者グマ<br>¥2000
                </button>
                <button class="summon-btn" data-cost="5000" data-type="magic">
                    魔法グマ<br>¥5000
                </button>
                <button class="summon-btn" data-cost="10000" data-type="mecha">
                    メカグマ<br>¥10000
                </button>
                <button class="summon-btn" data-cost="50000" data-type="galaxy">
                    銀河グマ<br>¥50000
                </button>
            </div>

            <button id="back-to-select-btn">撤退する (ステージ選択)</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
