<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くま大戦争</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="stage-select-screen">
            <h1>くま大戦争</h1>
            <h2>ステージを選んでください</h2>
            <div class="stage-list">
                <button class="stage-btn" data-stage="1">ステージ 1: 森の入り口</button>
                <button class="stage-btn" data-stage="2">ステージ 2: 蜂蜜の川</button>
                <button class="stage-btn" data-stage="3">ステージ 3: 洞窟の奥</button>
            </div>
        </div>
        <div id="game-screen" style="display: none;">
            <h2 id="current-stage-title"></h2>
            <div id="game-area">
                <!-- ここにゲーム画面が描画されます -->
                <p>ゲーム中...</p>
                <p>（ここにゲームのメインコンテンツが入ります）</p>
            </div>
            <button id="back-to-select-btn">ステージ選択に戻る</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
